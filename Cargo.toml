[workspace]
resolver = "2"
members = [
    "bins/sightglass",
    "bins/siphon-ai",
    "crates/admin-api-types",
    "crates/audit",
    "crates/bridge",
    "crates/cdr",
    "crates/config",
    "crates/core",
    "crates/http",
    "crates/media-glue",
    "crates/protocol-testkit",
    "crates/quality",
    "crates/recording",
    "crates/routes",
    "crates/security",
    "crates/stir-shaken",
    "crates/sip-glue",
    "crates/telemetry",
    "crates/webhooks",
]

[workspace.package]
version = "0.49.3"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["SiphonAI contributors"]
repository = "https://github.com/thevoiceguy/siphon-ai"
homepage = "https://github.com/thevoiceguy/siphon-ai"

[workspace.dependencies]
# Internal crates (used by bins/siphon-ai and cross-crate)
siphon-ai-admin-api-types = { path = "crates/admin-api-types" }
siphon-ai-audit       = { path = "crates/audit" }
siphon-ai-bridge      = { path = "crates/bridge" }
siphon-ai-cdr         = { path = "crates/cdr" }
siphon-ai-quality     = { path = "crates/quality" }
siphon-ai-config      = { path = "crates/config" }
siphon-ai-core        = { path = "crates/core" }
siphon-ai-http        = { path = "crates/http" }
siphon-ai-media-glue  = { path = "crates/media-glue" }
siphon-ai-recording   = { path = "crates/recording" }
siphon-ai-routes      = { path = "crates/routes" }
siphon-ai-security    = { path = "crates/security" }
siphon-ai-stir-shaken = { path = "crates/stir-shaken" }
siphon-ai-sip-glue    = { path = "crates/sip-glue" }
siphon-ai-telemetry   = { path = "crates/telemetry" }
siphon-ai-webhooks    = { path = "crates/webhooks" }

# Async runtime
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["codec"] }
futures     = "0.3"
async-trait = "0.1"

# Errors
anyhow    = "1"
thiserror = "1"

# Serde / formats
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# Bytes / encoding
bytes  = "1"
base64 = "0.22"

# Recording Opus/Ogg output (0.25.0, DESIGN_RECORDING_COMPLIANCE §5 D4):
# `ogg` is the theme's one new small dep; audiopus is already in-tree
# via forge-engine's opus feature (same version — no duplicate build).
ogg      = "0.9"
audiopus = "0.3.0-rc.0"

# JSON Schema generation for the WS protocol (0.27.0, DESIGN_PROTOCOL_SDKS
# §2 D1): dev-path only — pulled in solely by the `json-schema` feature on
# siphon-ai-bridge/-security; the daemon binary never carries it.
schemars = "1.2"

# Crypto (HMAC for webhook signing; SHA-256 + constant-time eq for
# admin token auth; AES-GCM + zeroize for recording encryption-at-rest —
# both already in-tree transitively via rustls, promoted to direct for
# DESIGN_RECORDING_COMPLIANCE §2)
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
aes-gcm = "0.10"
zeroize = "1"

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# tokio-rustls: only used to name the `ServerConfig` type returned
# by `sip_transport::load_rustls_server_config` so the daemon can
# pass it around. Already pulled transitively by sip-transport's
# `tls` feature; declaring it here just gives us a name.
tokio-rustls = "0.26"

# HTTP client (CDR webhook sink, lifecycle webhooks)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Admin / health HTTP server
hyper      = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Tracing / metrics
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "json"] }
metrics                     = "0.24"
metrics-exporter-prometheus = "0.18"

# Match / parse
regex = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Sightglass TUI (bins/sightglass ONLY — the daemon never links these;
# DESIGN_SIGHTGLASS.md §9). crossterm comes via ratatui's re-export so
# the two can't version-skew.
ratatui = "0.29"

# Utilities
parking_lot = "0.12"
once_cell   = "1"
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# ─── Upstream voice stack (separate repos, owned by us) ──────────────────────
# These are git deps for now; once published to crates.io we'll switch to
# versioned releases. Pinned to specific commit revs for reproducibility —
# `branch = "main"` would mean a tagged release could build different code
# later if upstream moves. To bump, run `git ls-remote` for the upstream's
# main branch and replace the rev hashes here (see CLAUDE.md §7.5).

# siphon-rs — RFC 3261 SIP stack.
# Bumped 2026-08-18 `15303bf847e6` → `99da91f599e2` = siphon-rs #109 + #110
# (its issues #107 and #108, both filed from this project). Two log levels;
# no behaviour change and nothing to configure.
# #109: `IntegratedUAC` warned on every 401/407 while `auto_retry_auth` was
# set. That is RFC 3261 §22 working exactly as specified — the registrar is
# supposed to challenge, the stack answers it immediately, the request
# succeeds — so nothing had happened an operator could act on. Measured on
# this project's reference node at a 120 s granted expiry: ~1,440 WARNs/day
# on an idle, healthy box, 361 of them in a single 6-hour window. A
# permanent non-zero warn baseline is what makes warn-level alerting
# useless. The two genuinely abnormal auth outcomes in the same function —
# "auth still rejected" and "auth retry limit reached" — keep their `warn!`.
# #110: four per-transaction `info!` sites (transaction start, the
# authenticated-retry start, and `on_final` in both `InviteTransactionUser`
# and `SimpleTransactionUser`) drop to `debug!`, matching `on_provisional`,
# which was always `debug!` for the same "a response arrived on the
# transaction I started" mechanic. At `info` the volume tracked request
# rate rather than operator intent: ~13,100 client transactions produced
# 52,568 lines from those four statements alone — ~750 lines/s at a
# sustained 566 txn/s, and a 20 MB log in 70 s of driving.
# **No code change here**: both are log-level changes inside siphon-rs.
# Anyone running `RUST_LOG=siphon=info` gets a quieter journal; anything
# already at `debug` is unaffected.
# (Prior: 2026-08-18 `9ad33983b0e9` → `15303bf847e6` = siphon-rs #104
# (its issue #103, filed from this project): client transactions that
# completed normally never left the manager's table. The terminal wait
# timers — K for non-INVITE (RFC 3261 §17.1.2.2), D for INVITE (§17.1.1.2) —
# set the FSM `Terminated` but emitted only `Cancel`, while the manager
# removed the entry solely on `Terminate`, which is reserved for abnormal
# endings because it notifies the TU. So a client transaction that FAILED
# was reclaimed and one that SUCCEEDED was not, and with no periodic sweep
# the only thing that ever removed a completed client transaction was the
# 10,000-entry eviction.
# Found here: this project's reference node registers every 60 s, and each
# refresh costs two client transactions (the 401'd REGISTER plus the
# authenticated retry), so it filled the cap in ~3.5 days and then evicted
# on every refresh — picking the victim by `start_time` alone, so a live
# transaction could be the one taken. Wider than REGISTER (OPTIONS, INFO,
# MESSAGE, NOTIFY, SUBSCRIBE, UAC BYE, and INVITE after a non-2xx) and both
# transports; client-side only, as the server's Timer J/I already terminate.
# **No code change here and nothing to configure** — the reap is entirely
# inside `TransactionManager`, keyed on FSM state so the transaction-user
# contract is unchanged. Operators get the fix by upgrading.
# Also carries siphon-rs #105 (clippy backlog) and #106 (a pinned fmt+clippy
# CI gate), neither of which changes behaviour.)
# (Prior: 2026-08-14 `9f70b83011f2` → `9ad33983b0e9` = siphon-rs #102:
# `TransactionManager::ack_received` now returns whether it **absorbed** the
# ACK (siphon-rs #101, filed from this project). It used to return `()` and
# no-op on a miss, which hid the one distinction RFC 3261 §17.2.1 makes:
# an ACK for a non-2xx final belongs to the completed INVITE server
# transaction alone, while an ACK for a 2xx is end-to-end and only the TU
# can handle it. The FSM already knew — `send_final` terminates the server
# transaction on a 2xx and leaves it `Completed` on a non-2xx, so "matched
# an entry" is exactly "ACK to a non-2xx" — and only had to say so.
# Used immediately by the packet pump below, which stops handing absorbed
# ACKs to the UAS; see `handle_packet` in `bins/siphon-ai/src/runtime.rs`.)
# (Prior: 2026-08-13 `b9f5a3bf66f2` → `9f70b83011f2` = siphon-rs #100: the UAC
# session refresh reserves the CSeq it consumes *before* the request leaves,
# instead of committing it after the response (siphon-rs #99, filed from this
# project's #490). Upstream's window was ours: for a whole round trip the
# shared dialog still read the pre-request number, so an owner request that
# raced the refresh — a teardown BYE, a hold re-INVITE, a REFER — reused it.
# `start_session_timer` had documented that as unclosable at that layer, on
# the reasoning that the alternative was serialising behind the dialog's write
# lock across a ~32 s round trip; reserving holds it for two clones and an
# increment instead.
# Changes nothing on the wire for 0.48.16: nothing here calls
# `CallHandle::start_session_timer`, and our own legs are already covered by
# `DialogSource::reserve_cseq` (#491), which does the same thing on the
# `shared_dialog` upstream never touches. It removes the last reason not to
# adopt the upstream timer, which is what #484 is now gated on.)
# (Prior: 2026-08-12 `b71a75f1eacf` → `b9f5a3bf66f2` = siphon-rs #96 (the UAC
# session timer refreshes the caller's own dialog rather than a private clone,
# siphon-rs #95) + #98 (a doomed refresh loop stops and says so, via a new
# `CallHandle::session_timer_state()` watch channel, siphon-rs #93).
# Neither reaches this daemon's behaviour today: nothing here calls
# `CallHandle::start_session_timer` — our outbound refresh drives
# `DialogControl` directly (see `core/src/outbound_service.rs`) — so both land
# as a correctness floor under any future switch to the upstream timer, not as
# a change to what 0.48.14 does on the wire.)
# (Prior: 2026-08-12 `9ae6ce2cee5a` → `b71a75f1eacf` = siphon-rs #91 (per-source
#  rate-limit warning throttle, our #90) + #94 (session refresh at se/2, our
#  #92).)
# (Prior: 2026-08-10 `daee496e1a17` → `9ae6ce2cee5a` = siphon-rs #89.)
# #89: the per-source ingress packet cap (200/sec, UDP datagrams and
# stream frames) becomes observable and configurable — it was a
# hard-coded constant that dropped SIP before the receive counter, with
# a warning carrying no count, and could be neither raised nor disabled
# (siphon-ai #459). Adds `set_udp_rate_limit` / `set_stream_rate_limit`
# and a `TransportMetrics::on_rate_limited` hook; the limiters move onto
# sip-ratelimit token buckets. Defaults are unchanged (200/sec, burst
# 200, 60s idle TTL) so capacity numbers carry over.
# (Prior: `daee496e1a17` = siphon-rs #87.)
# #87: sip-auth discriminates a nonce reuse-window rejection (correct
# digest, known valid nonce, >max_request_age since its last successful
# auth — rejected before the digest is compared) from a credential
# failure, via nonce_reuse_expired / is_nonce_reuse_expired in
# nonce_is_stale's post-hoc-query style. Lets the inbound digest gate
# score honest pre-emptively-authenticating peers as `stale` instead of
# `failed` (siphon-ai #430).
# (Prior: `74b903b9afe7` = #85 one m-line per media type in
#  negotiate_answer (siphon-ai #406 root) + #86 IntegratedUAC auto-retry
#  on 401/407 (siphon-rs #83);
#  `065c2c65a0f7` = #82 route set fixed after dialog creation,
#  #79 tls_server_name, #80 RFC 5626 ping, #78 UAS route-set order;
#  `4e7d5d7d0bd7` = #74 flow teardown on peer FIN + failover;
#  `ead16f9bf9b7` = #72 per-request From tag, RFC 3261 §8.1.1.3;
#  `5c7cf20beb50` = #70 TLS pool cross-SNI reuse, siphon-ai #342 outbound;
#  `fbdf132a11d6` = #69 in-dialog BYE route set, siphon-ai #342 inbound;
#  `50866b1599a7` = #68 pool SIP HEP, siphon-ai #341;
#  `6fd432270bb8` = #67 dialog_manager share, siphon-ai #324;
#  `fcaff011f9c6` = #65 invite_with_from, siphon-ai #316;
#  `3a4fc312ade3` = #64 TLS-SNI-is-hostname, siphon-ai #312.)
sip-core        = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
sip-parse       = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
sip-transport   = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2", features = ["tls"] }
sip-transaction = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
sip-dialog      = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
sip-uas         = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
sip-uac         = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
sip-auth        = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
sip-dns         = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
# sip-sdp — the SAME sip-sdp sip-uac's SdpAnswerGenerator trait speaks
# (distinct from forge-media's pinned sip-sdp). Used by the outbound
# delayed-offer answer generator to hand the UAC a SessionDescription it
# accepts. Must stay on the same siphon-rs rev as the rest below.
sip-sdp         = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
sip-hep         = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
# sip-observe — the transport-layer observability seam. We implement its
# `TransportMetrics` trait in siphon-ai-telemetry and install it with
# `set_transport_metrics`, which is the only way to see ingress
# rate-limit drops: the hook is defaulted to a no-op upstream, so an
# embedder that installs nothing (as we did until 0.48.11) silently gets
# the `NoopTransportMetrics` fallback (siphon-ai #459).
sip-observe     = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }
# sip-identity — STIR/SHAKEN Identity-header parsing + PASSporT verification
# (ES256 + X.509 chain validation). Consumed by the stir-shaken verifier crate.
sip-identity    = { git = "https://github.com/thevoiceguy/siphon-rs", rev = "99da91f599e2" }

# forge-media — RTP / codecs / SDP / DTMF / engine.
#
# We disable forge-engine's default features and re-enable only `g722`, which
# drops the `forge-ai-stream` transitive dep (and through it OpenAI / Anthropic
# / Deepgram / ElevenLabs WebSocket clients). SiphonAI is provider-neutral —
# AI logic belongs in the WS server, never here. See CLAUDE.md §4.1 and the
# upstream gate at https://github.com/thevoiceguy/forge-media/pull/39.
#
# forge-media is pinned to a `main` rev. Bumped 2026-08-18 to b161adedee5d
# = six commits, all dependency bumps: #106 bytes 1.12.1, #109 base64
# 0.23.1, #110 validator 0.21.0, #113 a 7-crate patch group, #114 h2 0.4.16
# (RUSTSEC-2026-0258) plus the deletion of forge-ai-stream's unused reqwest
# 0.11, and #107 redis 1.2.0 with the two call sites its 1.x API removed.
# **No forge-media source change touches code we compile, and no fix here
# is one we needed.** #114's h2 bump lives in forge-media's own lockfile,
# which does not apply to a git dependency, and its only source edit is to
# forge-ai-stream — the crate CLAUDE.md §4.1 keeps us off. #107's redis
# sits behind forge-engine's `persistence-redis`, which implies `ai`, which
# we disable; `redis` appears nowhere in this workspace's lockfile. Our own
# copy of RUSTSEC-2026-0258 was fixed here separately, in #522 (h2 0.4.16 +
# crossbeam-epoch 0.9.20). Bumped to keep the pin current, not for a fix.
# One thing does reach our build: #109 moves forge-sdp to **base64 0.23.1**,
# which now builds alongside the 0.22.1 we use ourselves. Same situation as
# the sha1/hmac/sha2 note below — a duplicate version, harmless, dedupe
# when we move our own base64.
# (Prior: 2026-08-14 to 1d7bbaba0c22
# = forge-media #112 (its issue #111, filed from this project's #504): a
# port bind that hits AddrInUse now retries the next pair instead of
# failing the session. `PortPool` allocates from its own bookkeeping and
# binds later, so a port it believes free can be held by a socket outside
# the process — our `rtp_port_range` sits inside the kernel's ephemeral
# range, and a DNS lookup by anything on the host is enough to take one.
# That surfaced here as a `500 Server Internal Error` on an inbound INVITE,
# measured at one call in 399 during the 0.48.18 soak. Upstream now splits
# `ForgeError::AddrInUse(SocketAddr)` out of `Network(String)` and draws up
# to five pairs. **Additive for us**: nothing in this workspace matches on
# `ForgeError`, so the new variant changes no code here.
# The `net.ipv4.ip_local_reserved_ports` guidance in docs/DEPLOY.md stays
# correct and is still worth applying — this removes the *requirement*,
# not the value, of reserving the range.)
# (Prior: 2026-08-07 to b4f8df5c8f09
# = forge-media #102 + #104 + #105 (plus dependabot bumps #88/#89/#91/#99).
# #102: every facade metric family gets describe_*! HELP text and every
# histogram explicit buckets (forge's sibling of siphon-ai #432); six
# forge-api metrics were renamed to gain the forge_ prefix — forge-api is
# not a crate we consume, and no siphon-ai dashboard/doc referenced the old
# names. #104: sha1 0.11 / hmac 0.13 / sha2 0.11 (digest 0.11 move) — we
# still ship hmac 0.12 / sha2 0.10 for our own use, so those now build as
# duplicate versions; harmless, dedupe when we do our own digest move.
# #105: forge_rtcp_sender_{packets,bytes}_total now count SR deltas per
# SSRC instead of summing running totals. `metrics` facade stays 0.24 on
# both sides (must move in lockstep with our exporter — see v0.31.1 note).
# external/siphon-rs submodule unchanged (74b903b).)
#
# Prior pin: bumped 2026-07-30 to aeae479b391d
# = forge-media #100: external/siphon-rs submodule f3454c7 → 74b903b, which
# is how siphon-rs #85 (negotiate_answer accepts one m-line per media type)
# reaches forge-sdp — the negotiator siphon-ai's media path actually runs.
# The outbound delayed-offer fixes (siphon-ai #406) depend on this behavior.
#
# Prior pin 003b5e1be563 = forge-media #98: per-SSRC SRTCP replay windows
# (RFC 3711 §3.4). The
# receive context kept ONE replay window keyed only by SRTCP index, so when
# the inbound RTCP SSRC changed mid-call (Twilio: ringback/early-media →
# answered stream) the new SSRC's fresh low indices were rejected as
# replays — spurious "SRTCP replay attack detected" WARNs, false positives
# in forge_srtcp_replay_attacks_blocked_total, and dropped RTCP reports
# during the changeover, on normal SRTP trunk calls. The SRTCP sibling of
# the #94 RTP-stats SSRC fix. No API change; SRTP calls just stop logging
# false replay hits.
#
# Prior pin 6e3fcd2e7c6f = #96, a docs/test-only correction on top of #94:
# the #330 mechanism is a sequence discontinuity at the stream change, NOT
# uncounted early media.
#
# The substantive stats fix is #94 (24e20ae1e8ac), still in effect:
# per-SSRC receive-side stream stats. `RxStreamStats` had
# no SSRC field and compared sequence numbers across sources that RFC 3550
# §8 gives independent sequence spaces; it now re-baselines when the SSRC
# changes, carrying prior streams' real loss forward. Fixes siphon-ai #330:
# a trunk that sends ringback as early media and switches SSRC at the answer
# left the baseline anchored in the ringback era, so `rx_packets_lost` came
# out as `ring_seconds x 50`, frozen for the call, pinning the transport MOS
# estimate to 1.0 on every call with a normal ring time — and feeding that
# into the CDR `quality` block and Homer's HEP QoS. No API change here; the
# counters this daemon already reads simply stop being wrong.
# (forge-media #95 previously tracked an "early media goes uncounted"
# follow-up; it was closed invalid — that premise was measured false.)
# Feature-enabled builds need rustc >= 1.91 (tract 0.23) — our pinned
# toolchain is 1.95. (siphon-rs is pinned separately above; see its own
# comment for the current rev.) Prior forge pins: forge 1c996ae5fb4f = #86
# neural VAD; forge 3c59b5f6e464 = #82-#85 dependency migrations; forge
# 5fa76fb38675 = #81.
forge-core    = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d" }
forge-rtp     = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d" }
forge-engine  = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d", default-features = false, features = ["g722", "dtls", "opus", "neural-vad"] }
forge-codecs  = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d" }
forge-sdp     = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d" }
forge-dtmf    = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d" }
forge-vad     = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d" }
forge-hep     = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d" }
# Conference rooms (0.7.0): forge-mixer is the per-room AudioMixer;
# forge-injection provides ToneGenerator (join/leave tones now, MOH
# for park later). Deliberately NOT forge-conference — its DTMF
# IVR/PIN/host-control layer is unused per DEV_PLAN_0.7.0.md §9.4.
forge-mixer     = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d" }
forge-injection = { git = "https://github.com/thevoiceguy/forge-media", rev = "b161adedee5d" }

# hep-rs — HEP3 codec, transport, HepSink trait. Owned by the same
# author as siphon-rs and forge-media; lives in its own repo.
#
# Kept on `branch = "main"` (NOT rev-pinned) on purpose: both
# siphon-rs and forge-media depend on hep-rs as `branch = "main"`,
# so pinning a `rev` here would create two distinct source URLs in
# the dep graph (`?rev=X` vs `?branch=main`) — cargo treats those
# as different crates, causing the classic "two different versions
# of crate `hep_rs` are being used" build error.
# Reproducibility for hep-rs is still enforced via the checked-in
# Cargo.lock entry (`source = git+…hep-rs?branch=main#<commit>`).
hep-rs = { git = "https://github.com/thevoiceguy/hep-rs", branch = "main" }

[profile.release]
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.dev]
# Keep dev builds fast; the audio hot path is profiled in release.
opt-level = 0
debug     = true
