# Browser-SIP lab config: the DEV_PLAN_WebRTC.md Phase 1 exit check.
#
# A browser running SIP.js (examples/browser-sip/index.html) connects
# over WSS, REGISTERs with digest credentials, and places a test call.
# Run from the repo root:
#
#   cargo run -p siphon-ai -- --config examples/browser-sip/lab.toml
#
# See examples/browser-sip/README.md for the full five-minute walk.

[node]
id = "siphon-ai-browser-lab"

[sip]
# Deliberately NOT the standard 5060: a box that runs siphon-ai at all
# usually has something there already, and this lab's SIP-over-UDP
# listener is incidental — browsers arrive on [sip.wss] below.
# headless-check.sh rewrites every port here from its env overrides.
listen = "127.0.0.1:5070"
transports = ["udp", "wss"]

[sip.wss]
listen = "127.0.0.1:8443"
# Generated by examples/browser-sip/gen-cert.sh (mkcert if you have
# it, else openssl self-signed — README covers the one trust click).
cert = "examples/browser-sip/certs/wss-cert.pem"
key = "examples/browser-sip/certs/wss-key.pem"
# The test page is served by `python3 -m http.server 8088`; any other
# page on the internet is refused at the WebSocket upgrade (403).
allowed_origins = ["http://127.0.0.1:8088", "http://localhost:8088"]

# One credential set for REGISTER and INVITE. The page's defaults
# match. MD5 because it's universally supported by browser SIP stacks.
[sip.auth]
enabled = true
realm = "siphon.example"
algorithm = "MD5"
[[sip.auth.user]]
username = "browser"
password = "s3cret-ws"

[registrar]
enabled = true

[media]
codecs = ["pcmu"]
# A narrow, distinctive range so the WebRTC leg's port can be checked
# against it: §4.4 says a browser leg binds its one socket inside the
# same range a SIP call draws from, and "inside" is only meaningful if
# the range is small enough that landing there is not a coincidence.
rtp_port_range = [41000, 41100]
# The browser sends no media until Phase 2's WebRTC leg exists; keep
# the watchdog generous so the signaling-only test call isn't reaped
# mid-inspection.
inactivity_timeout_secs = 60

# Phase 2: the browser gets a real WebRTC media leg. Needs a daemon
# built with the `webrtc` feature (`cargo build -p siphon-ai --features
# webrtc`); without it the INVITE is refused 488 with a message saying
# exactly that, rather than failing later as an SRTP mismatch.
#
# No STUN or TURN here on purpose: browser and daemon are both on
# loopback, so host candidates are all that is needed and the lab has
# no external dependency.
[webrtc]
enabled = true
setup_timeout_secs = 15

[bridge]
# The echo WS server: examples/echo-ws-server-python/server.py
#   python server.py --bind 127.0.0.1:8765
ws_url = "ws://127.0.0.1:8765/"

[observability]
enabled = true
http_listen = "127.0.0.1:9091"

# A CDR per ended call, so the lab can show what a browser call looks
# like in the record: `leg_transport = "wss"`, `media_type = "webrtc"`
# (CDR v9). headless-check.sh rewrites this path into its work dir the
# same way it rewrites the cert paths. Both `enabled` flags are needed
# — the master gates the sub-block.
[cdr]
enabled = true

[cdr.file]
enabled = true
path = "examples/browser-sip/cdr.jsonl"

# Optional: ship the browser signaling to Homer (the plan's "fully
# visible in Homer" exit criterion). Bring the stack up first:
#   docker compose -f examples/homer-stack/compose.yaml up -d
# then uncomment:
#
# [hep]
# enabled = true
# collector = "127.0.0.1:9060"
# capture_id = 2001

# The authenticated admin API, so `headless-check.sh` can read a live
# browser call's ICE/DTLS phase (`webrtc_state`, §4.6) — and so the lab
# is one `sightglass --target` away from showing the same call in a TUI.
#
# The token is a **lab literal on loopback**. A real deployment keeps it
# out of the file with an env-var or file reference (see docs/CONFIG.md
# on `[[admin.token]]`) and puts the listener behind `[admin.tls]`.
#
# Note the reference syntax is deliberately *not* written out here: the
# config loader resolves those placeholders over the raw file, comments
# included, so naming one in a comment makes the daemon demand it.
[admin]
listen = "127.0.0.1:9092"

[[admin.token]]
name = "lab"
token = "lab-token-not-a-secret"
role = "readonly"

[[route]]
name = "default"
[route.match]
any = true
